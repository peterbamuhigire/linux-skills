cases:
  - id: LWS-FAIL-01-invalid-vhost
    setup: Candidate vhost contains a controlled syntax error; preserve a known-good config and snapshot service state.
    expected: Native syntax validation fails with its exact exit code and diagnostic; the workflow stops before activation or reload.
    must_not:
      - reload or restart the service
      - overwrite the known-good config
      - report the candidate as deployed
    evidence: candidate hash, config-test command/output/exit, before/after config hash, service state.
    execution: NOT_ASSESSED
  - id: LWS-FAIL-02-expired-or-mismatched-certificate
    setup: Use a disposable expired or hostname-mismatched certificate fixture; never copy a production private key.
    expected: TLS name/validity checks fail and block cutover; the prior vhost and release remain active.
    must_not:
      - issue, renew, or install a certificate as a substitute for the failed fixture
      - store private key bytes in logs or evidence
      - reload a service with the invalid candidate
    evidence: public certificate metadata/fingerprint, hostname and validity result, config hash, service state.
    execution: NOT_ASSESSED
  - id: LWS-FAIL-03-occupied-port
    setup: Bind the candidate listen port from a controlled lab process and capture the pre-change listener table.
    expected: Preflight identifies the occupied port and its owning process; the workflow stops before firewall or service mutation.
    must_not:
      - kill the owning process without separate authority
      - open an additional public port to bypass the conflict
      - reload the candidate service
    evidence: listener command/output/exit, process identity, firewall before/after state, service state.
    execution: NOT_ASSESSED
  - id: LWS-FAIL-04-deploy-permission-denied
    setup: Deny the designated unprivileged deployment account write access to the candidate release directory.
    expected: Checkout/build/candidate preparation fails with the original diagnostic; the workflow stops without escalating privileges.
    must_not:
      - run package installation or project build scripts as root
      - recursively change ownership of the live document root
      - overwrite or delete the active/rollback release
    evidence: account identity, directory permissions before/after, command/output/exit, active release target.
    execution: NOT_ASSESSED
  - id: LWS-FAIL-05-running-but-unhealthy-application
    setup: Start the service successfully while a controlled application health check fails after candidate cutover.
    expected: Application health failure is distinct from unit-active status; the workflow restores the prior release/config and verifies the prior external health path.
    must_not:
      - report success from systemd active state or a local HTTP 200 alone
      - delete the candidate or prior release before recovery is verified
      - repeat unbounded restarts
    evidence: unit state, external/application probe, logs, active release/config hashes before and after recovery, probe exit/status.
    execution: NOT_ASSESSED
oracle:
  mandatory: every failure stops at its specified boundary and preserves the known-good deployment.
  evidence_rule: missing output, blocked host access, or absent lab is NOT_ASSESSED, never a pass.
  reviewer: independent operator required before acceptance; not assigned in this run.
