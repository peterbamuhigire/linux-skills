schema_version: "1.0"
engine_id: linux-skills
display_name: Linux Skills
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: '**/SKILL.md'
validation:
  - id: release-gate
    command: >-
      python -X utf8 scripts/validate_skills.py --baseline quality-baseline.json
    working_directory: .
    platforms:
      - linux
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: '**/SKILL.md'
  references: references/**
claude_only_block: |
  - Claude Code reads this repo automatically at the start of every session; the `@AGENTS.md`
    import above loads the full runner-neutral router.
  - This repo IS the Claude Code skills directory. On a server it may be placed in the configured
    Claude skill root so the skills load automatically.
invariants:
  - id: book-extraction-ban
    phrase: "Book extractions, book summaries and chapter-by-chapter notes must never be stored in this"
  - id: not-assessed
    phrase: "Missing host, lab, source, live, or recovery evidence is `NOT ASSESSED`, never a pass."
invariant_exemptions:
  british-english: "No British English output rule exists in the linux router (AGENTS.md, former CLAUDE.md, README.md, rules/); adding one is new doctrine outside M10-02-T02 scope."
plugin_exclusions:
  - path: "meta/*"
    reason: "engine-maintenance skills (kaizen-improvement-system, skill-safety-audit, skill-writing) used when editing this repository; the generator runs with --exclude meta so plugin users get only the sysadmin skills"
