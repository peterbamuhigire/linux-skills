name: Skill quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML pytest
      - name: Validate zero-debt contract
        run: python -X utf8 scripts/validate_skills.py --baseline quality-baseline.json
      - name: Test routing
        run: python -X utf8 scripts/routing_smoke_test.py
      - name: Check distro matrices
        run: bash scripts/tests/check-distro-matrix.sh
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check marketplace packages and file ceiling
        run: |
          python scripts/check_marketplace.py
          node scripts/generate-plugin-manifest.js --engine . --root . --exclude "docs,scripts,templates,tests,commands,meta,notes,prompts" --check
      - name: Check bounded hygiene regressions
        run: python scripts/kaizen_metrics.py --baseline docs/kaizen/2026-10-engine-kaizen/metrics-baseline.json
