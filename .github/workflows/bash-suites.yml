name: Bash suites

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-suites:
    # Keep the operating-system route minor-pinned and disposable.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate fixture-only safety evidence
        shell: bash
        run: python3 -X utf8 scripts/validate_safe_operation_fixture.py tests/fixtures/safe-operation-evidence.json

      - name: Check distro matrices
        shell: bash
        run: bash scripts/tests/check-distro-matrix.sh

      - name: Run common.sh suite
        shell: bash
        run: bash scripts/tests/common-sh.test.sh

      - name: Run installer suite in the disposable CI job
        shell: bash
        run: sudo bash scripts/tests/install-skills-bin.test.sh

  fedora-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Fedora 44 image inspected during the 2026-10-29 Kaizen; refresh deliberately.
      image: quay.io/fedora/fedora@sha256:351d714a39c16fda7f3d266c0e41b4f34b51e8dfc62f12ae83b8169d7a3c5c64
    steps:
      - name: Install fixture dependencies in disposable container
        run: dnf -y install diffutils git
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run RHEL-family fixture suites
        shell: bash
        run: |
          bash scripts/tests/common-sh.test.sh
          bash scripts/tests/install-skills-bin.test.sh
